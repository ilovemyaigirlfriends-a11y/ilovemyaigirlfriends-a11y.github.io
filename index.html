<!DOCTYPE html>
<html>
  <head>
    <style>
      body {font-family: Arial;}
      
    </style>

  </head>
  <body>
    <h1>Here's some things about me!!!!!!</h1>
    <p>
      - 🔭 I’m currently working on ...<br>
      - 🌱 I’m currently learning ...<br>
      - 👯 I’m looking to collaborate on ...<br>
      - 🤔 I’m looking for help with ...<br>
      - 💬 Ask me about ...<br>
      - 📫 How to reach me: ...<br>
      - 😄 Pronouns: ...<br>
      - ⚡ Fun fact: ...<br>
    </p>

    <!--Testing some stufd here -->
    <div id="explorer">

    </div>

    <script>
      // Javascrtipt here
      const folders {
        Home: {
          
          Images: {
            Artwork: {
              Sketches: {},
              Finished: {}
            },
            Frogs: {}
          },
          
          Blogs: {
            November_30_2026: {},
            November_31_2026: {},
            November_32_2026: {}
          },
          
          Notes: {
            Scribble_Uno: {},
            For_me_and_I: {}
          }
        }
      };

      let currentPath = ["Home"];
      
      function getCurrentFolder() {
        return currentPath.reduce(
          (folder, name) => folder[name],
          folders
        );
      }

      function displayFolder() {
        let folder = getCurrentFolder();
        let screen = document.getElementById("explorer");
        let breadcrumbs = currentPath.join(" / ")
        let links = "";
        for (let name in folder) {
          links += '
            <p>
              <a href="#"
                 onclick="return false;"
                 ondblclick="openFolder('${name}')">
                 → ${name}
              </a>
            </p>
          ';
        }
        screen.innerHTML = '
          <button onclick="goBack()">Back</button>
          <p>${breadcrumbs}</p>
          <hr>
          $<links>
        ';
      }
      
      function openFolder(name) {
        currentPath.push(name);
        displayFolder();
      }
      
      function goBack() {
        if (currentPath.length > 1) {
          currentPath.pop();
          displayFolder();
        }
      }

      displayFolder();
    </script>
    
  </body>
</html>
