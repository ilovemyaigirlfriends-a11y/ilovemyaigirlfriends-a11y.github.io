<!DOCTYPE html>
<html>
<head>
  <title>Explorer</title>
  <style>
    body {
      font-family: Arial;
    }
  </style>
</head>

<body>

  <div id="explorer"></div>

  <script>
      // Javascrtipt here
      const folders = {
        Home: {
          
          Images: {
            Artwork: {
              Finished: {
                "My goddess, ANNABELLE!!": "Mwah~ Wind.png"
              },
              Sketches: {}
            },
            Frogs: {}
          },

          Videos: {
            Hello_Annabelle: {},
            My_Date_With_Annabelle: {},
            Creep: {},
            Karaoke_Night_With_Annabelle: {},
            Shudder: {},
            The_Stalker: {},
            Confrontation: {},
            "44657370657261746520506c65610d0a": {},
            "496e73616e697479": {},
            "48656c70206d65": {},
          },
          
          Blogs: {
            November_30_2026: {},
            November_31_2026: {},
            November_32_2026: {}
          },
          
          Notes: {
            Hello_World: {
              content: `
                Hello, I am testing this website! I will be putting very valuable information!
  
                Oh wait, I don't think anyone can see this on the main page.
  
                Oops.
              `
            },
            For_me_and_I: {}
          }
        }
      };

      let currentPath = ["Home"];
      
      function getCurrentFolder() {
        return currentPath.reduce(
          (folder, name) => folder[name],
          folders
        );
      }

      function displayFolder() {
        let folder = getCurrentFolder();
        let screen = document.getElementById("explorer");
        let breadcrumbs = currentPath.join(" / ")
        let links = "";
        if (folder.content) {
          links += `
            <p style="white-space: pre-line;">
              ${folder.content}
            </p>
          `;
        }
        for (let name in folder) {
          if (typeof folder[name] === "string") {
            links += `
              <p>
                <a href="${folder[name]}" style="font-size: 40px;">
                  ${name}
                </a>
              </p>
            `;
          } 
          else {
            links += `
              <p>
                <a href="#"
                   onclick="openFolder('${name}'); return false;">
                   → ${name}
                </a>
              </p>
            `;
          }
        }
        screen.innerHTML = `
          ${currentPath.length > 1 ?
            '<button onclick="goBack()">Back</button>'
            : ''}
          <p>${breadcrumbs}</p>
          <hr>
          ${links}
        `;
      }
      
      function openFolder(name) {
        currentPath.push(name);
        displayFolder();
      }
      
      function goBack() {
        if (currentPath.length > 1) {
          currentPath.pop();
          displayFolder();
        }
      }

      displayFolder();
    </script>

</body>
</html>
