      let currentPath = ["Home"];
      
      function getCurrentFolder() {
        return currentPath.reduce(
          (folder, name) => folder[name],
          folders
        );
      }

      function displayFolder() {
        let folder = getCurrentFolder();
        let screen = document.getElementById("explorer");
        let breadcrumbs = currentPath.join(" / ")
        let links = "";
        if (folder.content) {
          links += `
            <p style="white-space: pre-line;">
              ${folder.content}
            </p>
          `;
        }
        for (let name in folder) {
          if (name === "content") continue;
          if (typeof folder[name] === "string") {
            links += `
              <p>
                <a href="${folder[name]}" target="_blank" style="font-size: 16px;">
                  ${name}
                </a>
              </p>
            `;
          } 
          else {
            links += `
              <p>
                <a href="#"
                   onclick="openFolder('${name}'); return false;">
                   → ${name}
                </a>
              </p>
            `;
          }
        }
        screen.innerHTML = `
          ${currentPath.length > 1 ?
            '<button onclick="goBack()">Back</button>'
            : ''}
          <p>${breadcrumbs}</p>
          <hr>
          ${links}
        `;
      }
      
      function openFolder(name) {
        currentPath.push(name);
        displayFolder();
      }
      
      function goBack() {
        if (currentPath.length > 1) {
          currentPath.pop();
          displayFolder();
        }
      }

      displayFolder();
    </script>
